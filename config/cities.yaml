cities:
  - city: Chicago
    city_code: CHI
    state: IL
    country: US
    timezone: America/Chicago
    station_id: KMDW
    settlement_source: NWS
    active: true
    kalshi_series: KXHIGHCHI
    kalshi_low_series: KXLOWTCHI
    # ACIS sid (ICAO form). The previous CLIMDW-style ids were NWS CLI product
    # codes, which ACIS rejects ("no data available") — that silently broke
    # fetch_settlement_observations for every city (found 2026-06-12).
    acis_station_id: KMDW
    nws_lat: 41.786
    nws_lon: -87.752
    # --- Calibrated 2026-04-09 from full KMDW historical dataset (all 12 months, 1364 samples) ---
    # mean_bias_correction_f = mean of all monthly mean_bias_f values from parquet (3.9599°F).
    # variance_multiplier = 0.7787 (annual recalibration; fallback for months with thin data).
    # Monthly values in bias_profiles/KMDW_monthly_profile.parquet take precedence at runtime.
    # heat/cold_bias_adjustment_f zeroed out — bias fully absorbed into monthly parquet profiles.
    # Previous values (2026-04-01): mean_bias_correction_f=3.1493, variance_multiplier=0.82
    variance_multiplier: 0.7787
    mean_bias_correction_f: 3.9599
    kde_bandwidth: 5.5
    tail_multiplier: 1.3
    model_weight_gfs: 0.35
    model_weight_ecmwf: 0.50
    model_weight_nam: 0.15
    model_weight_icon: 0.15
    model_weight_gem: 0.10
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0
    # September climate normal and anomaly trigger for conditional heat-bias adjustment.
    # 1991-2020 NOAA normal mean daily high at KMDW for September = 72.7°F.
    # When observed Sep mean daily high exceeds normal by > 5°F, an additional
    # -2.0°F heat_bias_adjustment_f is applied in the OOT accuracy report.
    sep_climate_normal_f: 72.7
    sep_anomaly_trigger_f: 5.0
    # Seasonal bias corrections (e.g. April spring cold-lake bias) are handled
    # entirely by bias_loader via the per-month parquet profile.
    # KMDW April: mean_bias_f=5.424, variance_multiplier=2.169 (116 samples).

  - city: New York
    city_code: NYC
    state: NY
    country: US
    timezone: America/New_York
    # Settlement station is Central Park (KNYC / CLINYC), NOT JFK.  The old
    # KJFK config forecast a coastal sea-breeze microclimate to settle a
    # vegetated inland park — flagged as a real bug in the 2026-06-11
    # research report.  Legacy KJFK bias profiles are orphaned by design;
    # NYC now runs on EMOS params keyed to KNYC.
    station_id: KNYC
    settlement_source: NWS
    active: true
    kalshi_series: KXHIGHNY
    kalshi_low_series: KXLOWTNYC
    acis_station_id: KNYC
    nws_lat: 40.7789
    nws_lon: -73.9692
    # --- Calibrated 2026-03-20 from NYC backtest run (Aug 2023) ---
    # GFS mean warm bias = +0.91°F over 32 dates → mean_bias_correction_f = -0.91
    # Brier-optimal sigma = 2.75°F → variance_multiplier = 2.75 / GFS_RMSE(3.23) = 0.85
    # kde_bandwidth = 2.75 (Brier-optimal sigma; Silverman rule gives 1.46°F)
    variance_multiplier: 0.7202
    mean_bias_correction_f: 2.1722
    kde_bandwidth: 2.75
    tail_multiplier: 1.0
    model_weight_gfs: 0.4
    model_weight_ecmwf: 0.4
    model_weight_nam: 0.2
    model_weight_icon: 0.15
    model_weight_gem: 0.10
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0

