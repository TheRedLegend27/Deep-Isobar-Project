cities:
  - city: Chicago
    city_code: CHI
    state: IL
    country: US
    timezone: America/Chicago
    station_id: KORD
    settlement_source: NWS
    active: true
    # --- Calibrated 2026-03-17 from CHI backtest run (90-day summer window) ---
    # Backtest results before calibration: win_rate=83.3%, gross_pnl=49.87,
    # max_drawdown=5.32, total_trades=36 (>= 80°F win_rate=80.0%, >= 90°F 87.5%)
    # Error analysis: GFS mean_error=+1.50°F rmse=3.16°F;
    #                 ECMWF mean_error=+0.44°F rmse=1.87°F
    # Weighted bias (GFS×0.35 + ECMWF×0.50): +0.87°F warm → correction -0.9°F
    variance_multiplier: 1.36
    mean_bias_correction_f: 2.04
    kde_bandwidth: 5.5
    tail_multiplier: 1.3
    model_weight_gfs: 0.35
    model_weight_ecmwf: 0.50
    model_weight_nam: 0.15
    heat_bias_adjustment_f: -0.3
    cold_bias_adjustment_f: 0.0

  - city: New York
    city_code: NYC
    state: NY
    country: US
    timezone: America/New_York
    station_id: KJFK
    settlement_source: NWS
    active: true
    # --- Calibrated 2026-03-20 from NYC backtest run (Aug 2023) ---
    # GFS mean warm bias = +0.91°F over 32 dates → mean_bias_correction_f = -0.91
    # Brier-optimal sigma = 2.75°F → variance_multiplier = 2.75 / GFS_RMSE(3.23) = 0.85
    # kde_bandwidth = 2.75 (Brier-optimal sigma; Silverman rule gives 1.46°F)
    variance_multiplier: 0.85
    mean_bias_correction_f: -0.91
    kde_bandwidth: 2.75
    tail_multiplier: 1.0
    model_weight_gfs: 0.4
    model_weight_ecmwf: 0.4
    model_weight_nam: 0.2
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0

  - city: Phoenix
    city_code: PHX
    state: AZ
    country: US
    timezone: America/Phoenix
    station_id: KPHX
    settlement_source: NWS
    active: true
    variance_multiplier: 0.9
    mean_bias_correction_f: 0.0
    kde_bandwidth: 0.9
    tail_multiplier: 1.0
    model_weight_gfs: 0.3
    model_weight_ecmwf: 0.5
    model_weight_nam: 0.2
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0

  - city: Denver
    city_code: DEN
    state: CO
    country: US
    timezone: America/Denver
    station_id: KDEN
    settlement_source: NWS
    active: true
    variance_multiplier: 1.3
    mean_bias_correction_f: 0.0
    kde_bandwidth: 1.5
    tail_multiplier: 1.15
    model_weight_gfs: 0.35
    model_weight_ecmwf: 0.45
    model_weight_nam: 0.2
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0

  - city: Dallas
    city_code: DAL
    state: TX
    country: US
    timezone: America/Chicago
    station_id: KDFW
    settlement_source: NWS
    active: true
    # --- Texas summer meteorological defaults (DFW) — pre-calibration ---
    # Dallas/Fort Worth avg August high ~98°F (range ~88–110°F).
    # GFS runs consistently warm in hot/humid Texas summers: +1.5–2.0°F bias.
    # Higher variance_multiplier reflects convective breaks (cold fronts can
    # drop highs 10–15°F in a day) vs. persistent multi-day heat waves.
    # ECMWF slightly outperforms GFS for DFW; NAM captures outflow better.
    # heat_bias_adjustment_f: extra GFS warm correction during heat-wave regimes.
    # Run analyze_mispriced_markets("Dallas") after the first backtest to
    # derive calibrated values from the actual error distribution.
    variance_multiplier: 1.25
    mean_bias_correction_f: -1.5
    kde_bandwidth: 1.8
    tail_multiplier: 1.25
    model_weight_gfs: 0.35
    model_weight_ecmwf: 0.45
    model_weight_nam: 0.20
    heat_bias_adjustment_f: -0.5
    cold_bias_adjustment_f: 0.0