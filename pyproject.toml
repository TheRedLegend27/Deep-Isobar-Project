[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-isobar"
version = "0.1.0"
description = "Autonomous weather intelligence and prediction market trading engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "requests",
    "pyarrow",
    "pytest",
    "pydantic",
    "PyYAML",
    "loguru",
    "python-dateutil",
    "cryptography",
    "python-dotenv",
    "anthropic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]