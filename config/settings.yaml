project:
  name: deep-isobar
  environment: development
  timezone: America/New_York

paths:
  data_dir: data
  raw_dir: data/raw
  normalized_dir: data/normalized
  forecasts_dir: data/forecasts
  features_dir: data/features
  markets_dir: data/markets
  backtests_dir: data/backtests
  logs_dir: data/logs

scheduler:
  # Daily jobs run by deep_isobar.supervisor (single long-running process).
  # Windows: registered in Task Scheduler at logon — see start_supervisor.bat.
  # macOS:   launchd agent — see `make mac-install` / deploy/macos/.
  # Times are LOCAL MACHINE time. Missed jobs (machine asleep) run on catch-up.
  poll_seconds: 60
  jobs:
    # Refit EMOS + extend training parquets + record the day's ensemble
    # spread BEFORE the session, so it always trades fresh params.
    - name: emos_training
      module: deep_isobar.calibration.emos_training
      at: "06:15"
    # Kalshi lists next-day high-temp markets mid-morning (observed between
    # ~07:30 and ~10:17 ET) — 07:00 always found zero contracts. Jul 8-10
    # 2026 sessions silently placed no trades because of this.
    - name: paper_trade_session
      module: deep_isobar.research.paper_trade_session
      at: "10:30"
    # Ops health invariants — screams (red embed + nonzero exit → supervisor
    # failure embed) the day the system starts failing silently: dead
    # session, unsettled positions >48h, silent/stub-shaped collector,
    # stale params, missing scorecards.  Also rendered atop the scorecard.
    - name: ops_health
      module: deep_isobar.ops.health
      at: "11:15"
    - name: intraday_check
      module: deep_isobar.research.intraday_check
      at: "14:00"
    - name: settle_paper_trades
      module: deep_isobar.research.settle_paper_trades
      at: "18:00"
    # Cross-verify our WIN/LOSS grading against Kalshi's official results —
    # a mismatch means our contract semantics disagree with the exchange.
    - name: verify_settlements
      module: deep_isobar.research.verify_settlements
      at: "18:30"
    # Calibration + trading scorecard after settlement (markdown report in
    # data/reports/ + Discord embed).
    - name: daily_scorecard
      module: deep_isobar.research.daily_scorecard
      at: "18:45"
    - name: generate_dashboard
      module: deep_isobar.research.generate_dashboard
      at: "19:15"
    # Orderbook history recorder — market depth cannot be fetched
    # retroactively, so this runs all trading day.  Live mode only (refuses
    # to record stub books).  ~60 contracts per cycle.
    - name: orderbook_collector
      module: deep_isobar.data.orderbook_collector
      every_minutes: 10
      window: "06:00-21:00"
      # Normal runs finish in ~1-2min; the default 1h job timeout let a
      # stuck Kalshi-API run (2026-07-28) block this single-threaded
      # supervisor's entire queue for hours. Cap it tight since a timeout
      # here just means "try again in 10 minutes."
      timeout_seconds: 300
    # Nightly archive of the unreplaceable data/ assets (trades, params,
    # spread history) — see scripts/backup_data.py.  Retargets to TrueNAS
    # in Phase 1.
    - name: nightly_backup
      module: deep_isobar.ops.backup
      at: "21:30"

runtime:
  paper_trade: true
  scheduler_interval_seconds: 300
  model_scan_priority_windows_et:
    - "07:00-09:00"
    - "13:00-14:00"
    - "19:00-21:00"
    - "21:00-22:00"

anomaly:
  # Claude-powered anomaly detector. Paused 2026-06-11 — Anthropic API
  # credits exhausted. Set true again once the account is funded.
  # While false: no API calls, anomaly=None, position sizer applies the
  # NONE multiplier (1.0) instead of penalizing every trade as LOW (0.5).
  enabled: false

backup:
  # Nightly archive of the unreplaceable data/ assets (21:30 job).
  dest_dir: ~/DeepIsobarBackups   # keep OUTSIDE the repo and any iCloud path
  keep: 14                        # rotated archives to retain
  # rclone_remote: "remote:deep-isobar-backups"   # optional offsite copy

risk:
  # Pre-trade circuit breakers (trading/preflight.py) — any failure refuses
  # the city for the day.  Motivated by the 2026-07-02 stub-trade incident.
  preflight:
    enabled: true
    allow_stub_market: false      # true only for offline development
    bounds_margin_f: 15.0         # mean must be within history min/max ± this
    max_nbm_divergence_f: 6.0     # hard stop; session warns at 4.0 already
    max_params_age_days: 3
    min_sigma_f: 0.5
    max_sigma_f: 15.0
    min_contracts: 3
    # Wildfire-smoke stand-down (2026-07-14..17 Canadian smoke slump: NE
    # actuals came in 5-10F below ALL guidance; no model edge under smoke).
    # Block on any FU, or HZ with vis <= smoke_max_vis_mi, in recent METARs.
    smoke_gate: true
    smoke_lookback_hours: 6
    smoke_max_vis_mi: 6.0

  # Lowered 0.38 -> 0.10 with the EMOS calibration upgrade (2026-06-12).
  # The 0.38 threshold was a symptom of the mis-specified distribution
  # (5.5F std floor); with calibrated probabilities legitimate edges are
  # ~3-10 points, and 0.38 would never trade.  0.10 stays comfortably
  # above the Kalshi taker-fee peak (~1.75% of contract value at P=0.5).
  alpha_threshold: 0.10
  max_position_per_contract: 100
  max_daily_exposure: 1000

  # Kill switch (ops/kill_switch.py) — automatic-engage thresholds.  The
  # switch itself lives at data/KILL_SWITCH (file presence = engaged) and
  # is checked independently in submit_live_trade, run_preflight, and the
  # session loop, so nothing here can silently re-open trading. Disengaging
  # is always a deliberate human CLI action, never automatic.
  kill_switch:
    max_daily_loss_usd: 100.0     # ~20% of the initial $500 bankroll
    max_drawdown_pct: 0.20        # cumulative drawdown from equity peak
    max_consecutive_losses: 5
  multi_bracket:
    enabled: true
    max_contracts_per_session: 3      # max number of brackets to enter (per city)
    daily_exposure_cap_usd: 50.0      # static fallback only when position_sizing.enabled: false
    min_alpha_to_spread: 0.10         # must clear same threshold as primary signal
    # No shorting near-certain contracts: 348-trade replay (2026-08-22)
    # showed SELLs entered at YES >= 0.50 went 2W/10L for -$35 — tiny
    # premiums against dollar-sized busts. SELLs below this still trade
    # (0.20-0.35 entries were the profitable SELL band, +$66 on 53).
    max_sell_entry_price: 0.50
    allocation_method: kelly          # proportional | equal | kelly
    # Fee-adjusted fractional Kelly (research report 2026-06, Q6).  BUY and
    # SELL both spread; edges that die to the 0.07*P*(1-P) taker fee size
    # to zero.  Per-bet fraction is divided by 1+(N-1)*rho for same-day
    # cross-city airmass correlation (N = active cities unless overridden).
    # bankroll_usd intentionally NOT set here — position_sizing.bankroll_usd
    # below is the single authoritative figure; paper_trade_session injects
    # it into this dict at runtime so there is exactly one number to change.
    kelly:
      fraction: 0.25                  # fractional Kelly (raw Kelly overbets)
      avg_pairwise_correlation: 0.6   # same-day city outcome correlation
      # n_correlated_bets: 5          # default: number of TRADING cities
      # Brackets within one city all settle on the same temperature — a
      # bust takes out the whole spread (LA, 3 separate days, Aug 2026).
      # k same-city brackets are sized as ~one bet: each divided by
      # 1+(k-1)*rho.  0 disables.
      within_city_correlation: 0.8

  # Smart position sizer (trading/position_sizer.py) — go-live safety build,
  # Part 2.  Replaced the old static-$50-base dynamic_sizing block: across
  # 200+ settled paper trades that sizer barely moved (mean $48.57, min $40,
  # max $50) regardless of edge, entry price, or station quality, and the
  # $50/city x 5 cities math never fit a $500 bankroll (~$250/day at risk).
  # See research/validate_position_sizer.py for the historical replay.
  position_sizing:
    enabled: true
    # THE single authoritative bankroll figure — Kelly fractions, the daily
    # caps below, and the kill switch's drawdown/daily-loss triggers all
    # read this one number. Update here only; nowhere else.
    bankroll_usd: 500.0

    # Hard caps, all fractions of bankroll_usd. Ceilings, never floors —
    # position_sizer.py clamps to these, it never rejects for being over.
    max_risk_per_trade_pct: 0.025   # ~2.5% ($12.50 on $500) — no single
                                     # trade can claim a whole city's budget
                                     # no matter how large its Kelly edge is
    max_city_daily_pct: 0.03        # ~3% per city per day
    max_total_daily_pct: 0.10       # ~10% total per day across all cities
                                     # (on $500 that's ~$50/day, vs ~$250
                                     # under the old static-$50-per-city math)

    # Anomaly confidence multipliers (unchanged from the old sizer)
    anomaly_multipliers:
      HIGH: 1.0      # no penalty — model is confident
      MEDIUM: 0.70   # 30% reduction
      LOW: 0.50      # 50% reduction
      NONE: 1.0      # anomaly check didn't run — no penalty

    # Per-flag penalty (stacks multiplicatively with confidence multiplier)
    flag_penalties:
      FOG_MORNING: 0.85
      LAKE_BREEZE: 0.85
      COLD_START: 0.90
      FRONTAL_SUPPRESSION: 0.85
      NWS_MODEL_DIVERGENCE: 0.80

    # Ensemble spread penalty (ensemble_std_f thresholds in °F)
    spread_thresholds:
      clean: 3.0        # std < 3.0°F → no penalty (multiplier 1.0)
      moderate: 5.0     # 3.0–5.0°F → multiplier 0.80
      wide: 999.0       # > 5.0°F → multiplier 0.60

    # Cheap/rich-tail entry-price haircut. Chosen over exclusion: entries
    # <= $0.10 lost money at a ~35% win rate EXCLUDING the one +$252.09
    # outlier that is also the single biggest win in the book — the tail is
    # both the worst-calibrated segment and the source of the best trade.
    # A flat haircut (not zero) targets the calibration-error component
    # without forfeiting a genuine large mispricing; Kelly's own fraction
    # already demands an outsized edge this far from 0.50.
    cheap_tail_price_threshold: 0.10
    cheap_tail_multiplier: 0.35

    # Per-station calibration quality (accuracy vs. NBM benchmark + PIT
    # flatness, see position_sizer._calibration_multiplier). Floor only —
    # a station beating calibration expectations never sizes above 1.0.
    calibration_multiplier_floor: 0.50

    # Per-station realized track record — risk-off only, never boosts size
    # for a hot streak. Needs a large-enough sample before it does anything.
    track_record_min_trades: 20
    track_record_floor: 0.50
    track_record_worst_edge_usd: -0.10   # realized edge/contract this bad
                                          # or worse hits the floor multiplier

emos:
  # Member weights constrained >= 0 (Gneiting's original EMOS).  Validated
  # 2026-07-08: holdout CRPS 1.021 -> 1.004 mean across the 5 trading
  # stations (NY 1.273 -> 1.187).  ridge and trend-variance variants did
  # NOT beat base on holdout and are not enabled (see
  # research/validate_emos_variants.py).
  nonneg_weights: true
  # Per-station overrides beat the global keys above; key is the fit key
  # (KDFW = highs, KDFW_low = lows).  Ships only through the holdout race.
  station_overrides:
    # Dallas trend-variance: validated 2026-07-19 after the fixed-LST refetch
    # filled trend_f (104/109 days).  Holdout CRPS 1.663->1.569 (15d),
    # 1.380->1.312 (20d), 1.228->1.189 (25d) — the Jul 14-17 frontal cold
    # busts are exactly the wide-trend days e_trend widens sigma on.  Flat or
    # slightly worse at the other 4 stations (Boston +1%), so Dallas only.
    KDFW:
      trend_variance: true
  ridge_lambda: 0.0
  trend_variance: false

# Numeric trade-flip gate (research/flip_gate.py) — the objective criteria a
# data-only city must meet before `trade: false` -> `true` in cities.yaml.
# Replaces the judgment-call flips (LA was flipped 2026-08-05 on book depth +
# calibration and went 1W/15L; a track-record criterion now blocks re-flips
# of cities the paper book has already falsified).  Run:
#   python -m deep_isobar.research.flip_gate
flip_gate:
  window_days: 30              # calibration lookback (matches scorecard)
  min_calibration_days: 21     # need >= this many scored days in window
  max_crps_f: 1.00             # 30d CRPS ceiling (Boston, worst trader, ~1.00)
  require_beats_nbm: true      # EMOS MAE must beat NBM MAE (else no model edge)
  liquidity_days: 14           # orderbook lookback from the collector archive
  max_median_spread: 0.06      # median best_ask - best_bid (fraction of $1)
  # Benchmarked 2026-08-22 on 14d of books: the five profitable trading
  # cities score 59-72% (deep-tail strikes quote one-sided; NY = 59%), so
  # the bar sits just below the worst of them, not at an aspirational 75%.
  min_two_sided_frac: 0.55     # fraction of quotes with both bid and ask live
  min_series_volume_24h: 100.0 # median per-snapshot total volume across strikes
  # Cities with a real paper track record must not be re-flipped past it:
  # with >= min_track_trades settled in the last 60d, P&L must be positive.
  min_track_trades: 10

models:
  default_metric: high_temp_f
  comparison_operator: ge
  probability_surface:
    min_temp_f: 10
    max_temp_f: 120
  forecast_shift_significant_threshold_f: 2.0
  kde:
    default_bandwidth: 1.0
    min_points: 2

markets:
  enabled_sources:
    - Kalshi
  kalshi:
    # Base URL for the Kalshi v2 REST API.
    # Despite the "elections" subdomain this endpoint serves all Kalshi markets.
    base_url: "https://api.elections.kalshi.com/trade-api/v2"
    # Kalshi series ticker for Chicago high-temperature contracts.
    # Set credentials via env vars:
    #   KALSHI_API_KEY_ID        — your API key ID (from kalshi.com/account/profile)
    #   KALSHI_PRIVATE_KEY_PATH  — path to RSA private key PEM file
    #   KALSHI_PRIVATE_KEY       — inline RSA PEM (alternative to path, \n-escaped ok)
    series_ticker: "KXHIGHCHI"
    # Force stub mode even when credentials are present (useful for local dev).
    stub_mode: false

logging:
  level: INFO