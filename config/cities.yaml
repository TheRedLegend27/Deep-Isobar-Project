cities:
  - city: Chicago
    city_code: CHI
    state: IL
    country: US
    timezone: America/Chicago
    station_id: KMDW
    settlement_source: NWS
    active: true
    # --- Calibrated 2026-04-01 from CHI train/test split (May–Jul 2023 calibration window) ---
    # Derived by run_chicago_backtest.py phase 2: neutral-profile pass over May–Jul 2023,
    # then bias = -mean(forecast − actual), variance_multiplier = RMSE_after_bias / mean_effective_std.
    # heat/cold_bias_adjustment_f zeroed out — bias is fully absorbed into mean_bias_correction_f.
    # Previous values (2026-03-17): mean_bias_correction_f=2.04, variance_multiplier=1.36,
    #                                heat_bias_adjustment_f=-0.3
    variance_multiplier: 0.6837
    mean_bias_correction_f: 3.1493
    kde_bandwidth: 5.5
    tail_multiplier: 1.3
    model_weight_gfs: 0.35
    model_weight_ecmwf: 0.50
    model_weight_nam: 0.15
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0
    # September climate normal and anomaly trigger for conditional heat-bias adjustment.
    # 1991-2020 NOAA normal mean daily high at KMDW for September = 72.7°F.
    # When observed Sep mean daily high exceeds normal by > 5°F, an additional
    # -2.0°F heat_bias_adjustment_f is applied in the OOT accuracy report.
    sep_climate_normal_f: 72.7
    sep_anomaly_trigger_f: 5.0

  - city: New York
    city_code: NYC
    state: NY
    country: US
    timezone: America/New_York
    station_id: KJFK
    settlement_source: NWS
    active: true
    # --- Calibrated 2026-03-20 from NYC backtest run (Aug 2023) ---
    # GFS mean warm bias = +0.91°F over 32 dates → mean_bias_correction_f = -0.91
    # Brier-optimal sigma = 2.75°F → variance_multiplier = 2.75 / GFS_RMSE(3.23) = 0.85
    # kde_bandwidth = 2.75 (Brier-optimal sigma; Silverman rule gives 1.46°F)
    variance_multiplier: 0.85
    mean_bias_correction_f: -0.91
    kde_bandwidth: 2.75
    tail_multiplier: 1.0
    model_weight_gfs: 0.4
    model_weight_ecmwf: 0.4
    model_weight_nam: 0.2
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0

  - city: Phoenix
    city_code: PHX
    state: AZ
    country: US
    timezone: America/Phoenix
    station_id: KPHX
    settlement_source: NWS
    active: true
    variance_multiplier: 0.9
    mean_bias_correction_f: 0.0
    kde_bandwidth: 0.9
    tail_multiplier: 1.0
    model_weight_gfs: 0.3
    model_weight_ecmwf: 0.5
    model_weight_nam: 0.2
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0

  - city: Denver
    city_code: DEN
    state: CO
    country: US
    timezone: America/Denver
    station_id: KDEN
    settlement_source: NWS
    active: true
    variance_multiplier: 1.3
    mean_bias_correction_f: 0.0
    kde_bandwidth: 1.5
    tail_multiplier: 1.15
    model_weight_gfs: 0.35
    model_weight_ecmwf: 0.45
    model_weight_nam: 0.2
    heat_bias_adjustment_f: 0.0
    cold_bias_adjustment_f: 0.0

  - city: Dallas
    city_code: DAL
    state: TX
    country: US
    timezone: America/Chicago
    station_id: KDFW
    settlement_source: NWS
    active: true
    # --- Texas summer meteorological defaults (DFW) — pre-calibration ---
    # Dallas/Fort Worth avg August high ~98°F (range ~88–110°F).
    # GFS runs consistently warm in hot/humid Texas summers: +1.5–2.0°F bias.
    # Higher variance_multiplier reflects convective breaks (cold fronts can
    # drop highs 10–15°F in a day) vs. persistent multi-day heat waves.
    # ECMWF slightly outperforms GFS for DFW; NAM captures outflow better.
    # heat_bias_adjustment_f: extra GFS warm correction during heat-wave regimes.
    # Run analyze_mispriced_markets("Dallas") after the first backtest to
    # derive calibrated values from the actual error distribution.
    variance_multiplier: 1.25
    mean_bias_correction_f: -1.5
    kde_bandwidth: 1.8
    tail_multiplier: 1.25
    model_weight_gfs: 0.35
    model_weight_ecmwf: 0.45
    model_weight_nam: 0.20
    heat_bias_adjustment_f: -0.5
    cold_bias_adjustment_f: 0.0